name: Update buzz source
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'buzz tag to pin, empty for latest release'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-buzz-source
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            allow-import-from-derivation = false
            extra-substituters = https://cache.mulatta.io
            extra-trusted-public-keys = cache.mulatta.io-1:DrV+Oy2azNyVKM7ihhD1QoOetRUnW+1G6RWToUpSO4U=
      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update source pin
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$UPDATE_TAG" ]; then
            nix develop -c ./packages/source/update.py --tag "$UPDATE_TAG"
          else
            nix develop -c ./packages/source/update.py
          fi
      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          .github/ci/create_pr.py \
            "${{ steps.update.outputs.old_version }}" \
            "${{ steps.update.outputs.new_version }}"
